name: SetPlayer
options:
  bundleIdPrefix: com.alexdils
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  SetPlayer:
    type: application
    platform: iOS
    sources:
      - SetPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexdils.setplayer
        DEVELOPMENT_TEAM: 3WKAG55LV4
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: SetPlayer/Info.plist
      properties:
        CFBundleDisplayName: Set Player
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
