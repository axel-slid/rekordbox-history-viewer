name: SetPlayer
options:
  bundleIdPrefix: com.alexdils
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  SetPlayer:
    type: application
    platform: iOS
    sources:
      - SetPlayer
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexdils.setplayer
        DEVELOPMENT_TEAM: 3WKAG55LV4
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: SetPlayer/Info.plist
      properties:
        CFBundleDisplayName: Set Player
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UIBackgroundModes: [audio, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.alexdils.setplayer.analyze]
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  SetPlayerMac:
    type: application
    platform: macOS
    sources:
      - path: SetPlayerMac
        excludes:
          - Resources
      - path: SetPlayerMac/Resources
        buildPhase: resources
      - path: SetPlayer/Models.swift
      - path: SetPlayer/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexdils.setplayer.mac
        PRODUCT_NAME: Set Player
        DEVELOPMENT_TEAM: 3WKAG55LV4
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: SetPlayerMac/Info.plist
      properties:
        CFBundleDisplayName: Set Player
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.music
        NSAudioCaptureUsageDescription: Set Player records app audio and controls per-app volume using macOS system audio capture.
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: Copyright © 2026 Alex Dils
